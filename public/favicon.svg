<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <defs>
        <linearGradient id="favCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>

        <linearGradient id="favGoldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>

        <linearGradient id="favPurplePink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c084fc" />
            <stop offset="50%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
    </defs>

    <!-- Background Dark Glow Circle -->
    <rect width="100" height="100" rx="24" fill="#0b1021" />

    <!-- Figure 1: Left Cyan/Blue -->
    <path d="M 32 30 C 25 40, 22 60, 35 78 C 40 70, 48 55, 42 42 Z" fill="url(#favCyanBlue)" />
    <circle cx="30" cy="24" r="7" fill="url(#favCyanBlue)" />

    <!-- Figure 2: Top Gold/Amber -->
    <path d="M 40 28 C 55 20, 72 25, 78 36 C 68 42, 52 48, 46 36 Z" fill="url(#favGoldAmber)" />
    <circle cx="75" cy="20" r="7" fill="url(#favGoldAmber)" />

    <!-- Figure 3: Right Purple/Magenta -->
    <path d="M 76 42 C 82 58, 70 76, 52 82 C 55 70, 58 52, 68 46 Z" fill="url(#favPurplePink)" />
    <circle cx="56" cy="85" r="7" fill="url(#favPurplePink)" />

    <!-- Center Play Triangle Arrow -->
    <path d="M 42 34 L 70 50 L 42 66 Z" fill="#ffffff" fill-opacity="0.95" />
</svg>
